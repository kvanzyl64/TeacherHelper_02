<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-labelledby="title desc">
  <title id="title">Learning helper character</title>
  <desc id="desc">A round, animated line art learning helper with a pulsing heart.</desc>
  <style>
    .ink { fill: none; stroke: #111111; stroke-linecap: round; stroke-linejoin: round; stroke-width: 6; }
    .float { animation: float 3.2s ease-in-out infinite 1.1s; transform-box: fill-box; transform-origin: center; }
    .heart { animation: heart 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes heart { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .float, .heart { animation: none; } }
  </style>
  <circle cx="77" cy="109" r="56" fill="#b86cff"/>
  <circle cx="206" cy="110" r="58" fill="#64d8cb"/>
  <g class="float">
    <circle cx="140" cy="105" r="74" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <path class="ink" d="M116 91q9-8 18 0M157 91q9-8 18 0M126 121q14 9 28 0"/>
    <circle cx="125" cy="105" r="4" fill="#111111"/><circle cx="166" cy="105" r="4" fill="#111111"/>
    <path class="ink" d="M104 53q36-34 72 0M114 51 105 40M166 51l10-11"/>
    <path d="M66 169h40M66 181h29M66 193h34" fill="none" stroke="#111111" stroke-linecap="round" stroke-width="6"/>
    <g class="heart">
      <path d="M214 151v-13M207 158l-10-9M221 158l10-9" fill="none" stroke="#f45d48" stroke-linecap="round" stroke-width="6"/>
      <path d="M214 211c-5-5-30-21-30-40 0-14 17-20 30-6 13-14 30-8 30 6 0 19-25 35-30 40z" fill="#fef08a" stroke="#111111" stroke-linejoin="round" stroke-width="6"/>
    </g>
  </g>
</svg>
